name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TaskPrioMemory.sln

      - name: Build (Release)
        run: dotnet build TaskPrioMemory.sln -c Release --no-restore

      - name: Publish single-folder self-contained-free exe
        run: >
          dotnet publish src/TaskPrioMemory/TaskPrioMemory.csproj
          -c Release
          -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskPrioMemory
          path: publish/**
          if-no-files-found: error
