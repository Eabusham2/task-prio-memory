name: Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TaskPrioMemory.sln

      - name: Build (Release)
        run: dotnet build TaskPrioMemory.sln -c Release --no-restore

      - name: Publish single-folder self-contained-free exe
        run: >
          dotnet publish src/TaskPrioMemory/TaskPrioMemory.csproj
          -c Release
          -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskPrioMemory
          path: publish/**
          if-no-files-found: error

  # Pushing a tag like v1.1.0 publishes a GitHub Release with the exe
  # attached, giving a permanent download link (CI artifacts expire).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TaskPrioMemory
          path: publish
      - uses: softprops/action-gh-release@v2
        with:
          files: publish/TaskPrioMemory.exe
          generate_release_notes: true
